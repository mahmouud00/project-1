# بيبنى ملف الـ Setup بتاع SUITES على ويندوز أوتوماتيك مع كل رفع للكود.
# الملف الجاهز بيتنزّل من: Actions ← آخر تشغيل ← Artifacts
name: Build Windows installer

on:
  push:
    branches: [claude/ecstatic-cray-2rxf9q, main]
    paths: ["project 1/final_system/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"            # الرسايل العربى فى شاشة ويندوز من غير أخطاء
  PYTHONIOENCODING: "utf-8"

defaults:
  run:
    shell: pwsh
    working-directory: "project 1/final_system/app"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        compiler: [nuitka, pyinstaller]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the license public key is set
        run: |
          if (Select-String -Path server\license_key.py -Pattern "PUT-YOUR" -Quiet) {
            throw "Run license_tool/keygen.py first: the public key is missing"
          }

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Version and icon
        run: |
          $ver = python -c "import app_info; print(app_info.APP_VERSION)"
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          python make_icon.py

      - name: Compile with Nuitka
        if: matrix.compiler == 'nuitka'
        run: |
          python -m nuitka main.py --standalone --assume-yes-for-downloads --msvc=latest `
            --enable-plugin=pyside6 --include-qt-plugins=sensible,printsupport `
            --windows-console-mode=disable --windows-icon-from-ico=assets\app.ico `
            --include-data-dir=assets=assets --include-package=server `
            --include-module=cryptography.hazmat.primitives.asymmetric.ed25519 `
            --nofollow-import-to=tkinter --output-dir=build_nuitka --output-filename=SUITES.exe `
            --company-name="MYTECH Solutions" --product-name="SUITES" --file-description="SUITES" `
            --file-version=$env:VER --product-version=$env:VER
          "APPDIR=build_nuitka\main.dist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build with PyInstaller
        if: matrix.compiler == 'pyinstaller'
        run: |
          python -m PyInstaller tailor.spec --noconfirm --clean
          "APPDIR=dist\SUITES" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Self-test the exe
        run: |
          $p = Start-Process -FilePath "$env:APPDIR\SUITES.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\tailormaster_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Make the setup file
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VER /DSourceDir=$env:APPDIR installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if ("${{ matrix.compiler }}" -eq "pyinstaller") {
            Rename-Item "installer_output\SUITES_Setup_$env:VER.exe" "SUITES_Setup_$env:VER-quick.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SUITES_Setup_${{ matrix.compiler }}
          path: "project 1/final_system/app/installer_output/*.exe"
          retention-days: 30
